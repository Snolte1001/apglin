# Push und Pull Request: ein Linux-Job, um Actions-Minuten zu sparen.
# Windows und Python 3.9 nur bei manuellem Start (Actions → Tests →
# „Run workflow“ → „Volle Matrix“). Windows-Minuten zählen doppelt.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Volle Matrix (Linux + Windows, Python 3.9 und 3.12)"
        type: boolean
        default: false

permissions:
  contents: read

# Ein neuer Push bricht den noch laufenden Lauf desselben Branches ab.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-24.04", "windows-latest"]' || '["ubuntu-24.04"]') }}
        python-version: ${{ fromJSON(inputs.full && '["3.9", "3.12"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[test]
      - run: pytest -q
